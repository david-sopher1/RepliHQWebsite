# Netlify auto-detects Next.js and applies its OpenNext-based runtime
# (@netlify/plugin-nextjs) — no extra plugin config needed.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Security headers live in next.config.ts so they apply to runtime-served pages too.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
